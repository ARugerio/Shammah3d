<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Gerencial | SHAMMAH CREA 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f8fafc;
        }
        .glass-input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.35);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 lg:p-8">

    <!-- 1. PANTALLA DE BLOQUEO -->
    <div id="pantallaBloqueo" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-800 text-center space-y-6">
            <div class="space-y-2">
                <span class="p-4 bg-pink-500/10 border border-pink-500/30 rounded-2xl inline-block text-3xl mb-2">🔒</span>
                <h2 class="text-2xl font-black text-white tracking-tight">Acceso Gerencial</h2>
                <p class="text-slate-400 text-xs uppercase font-extrabold tracking-wider">SHAMMAH CREA 3D</p>
            </div>

            <form id="formPin" onsubmit="procesarLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="inputPin" maxlength="40" placeholder="Escribe tu contraseña" required autofocus
                        class="w-full text-center text-xl tracking-wider font-bold glass-input py-4 rounded-2xl border-slate-700 focus:border-pink-500 transition-all">
                </div>

                <div id="errorPin" class="text-xs font-bold text-rose-400 hidden bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl">
                    ❌ Contraseña no válida en el servidor.
                </div>

                <button type="submit" id="btnEntrar" class="w-full bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-extrabold py-4 rounded-2xl shadow-xl shadow-pink-500/20 transition-all">
                    Ingresar al Panel
                </button>
            </form>

            <a href="index.html" class="inline-block text-xs text-slate-400 hover:text-slate-200 underline font-bold transition-all pt-2">
                ⬅️ Volver al Mostrador
            </a>
        </div>
    </div>

    <!-- 2. PANEL GERENCIAL -->
    <div id="panelGerencial" class="w-full max-w-[96%] hidden space-y-6">
        
        <header class="w-full flex flex-wrap items-center justify-between gap-4 glass-card p-6 rounded-3xl shadow-2xl">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl sm:text-4xl font-black text-white">SHAMMAH <span class="text-pink-500">CREA</span></h1>
                    <span class="bg-pink-500/20 border border-pink-500/40 text-pink-300 text-xs font-extrabold px-3 py-1 rounded-full uppercase">Panel Gerencial</span>
                </div>
                <p class="text-slate-300 text-sm font-medium mt-1">Control Financiero, RESICO (1%), Fondo Redes (5%) y Pedidos Taller 3D</p>
            </div>
            <div class="flex items-center gap-2">
