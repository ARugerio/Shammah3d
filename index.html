<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Instantáneo | SHAMMAH 3D</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Lexend', sans-serif; 
            background-color: #FFF7F8;
        }
        @media print {
            body { background: white; }
            #btnWhatsapp, #btnPDF { display: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- BADGE SUPERIOR DE MARCA -->
    <div class="mb-3 px-5 py-1.5 bg-[#FDE2E7] border border-rose-200/80 rounded-full text-[11px] font-extrabold text-[#EC546D] tracking-wider uppercase shadow-sm text-center">
        MOSTRADOR DIGITAL DE COTIZACIÓN 3D
    </div>

    <!-- ENCABEZADO PRINCIPAL DE LOGOTIPO -->
    <header class="text-center mb-5">
        <h1 class="text-4xl sm:text-5xl font-black text-[#355345] tracking-wide">SHAMMAH <span class="text-3xl sm:text-4xl">3D</span></h1>
        <p class="text-xs font-bold text-[#EC546D] mt-1 uppercase tracking-widest">Diseña ♥ Crea ♥ Imprime</p>
    </header>

    <!-- TARJETA CONTENEDORA PRINCIPAL -->
    <main class="w-full max-w-md bg-[#FDE8ED]/90 backdrop-blur-sm rounded-[2.5rem] shadow-xl shadow-rose-200/50 border border-rose-200/80 p-6 sm:p-8 space-y-5">
        
        <!-- FORMULARIO DE COTIZACIÓN -->
        <form id="cotizadorForm" class="space-y-4" onsubmit="return false;">
            
            <!-- TÍTULO DE SECCIÓN -->
            <div class="flex items-center gap-2 border-b border-rose-200/60 pb-2">
                <span class="text-amber-400 text-lg">⚡</span>
                <h2 class="text-base font-extrabold text-[#355345]">Cotizador Rápido de Productos</h2>
            </div>
            
            <!-- Selector de Línea de Negocio / Categoría de Producto -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Tipo de Producto / Proyecto</label>
                <select id="lineaNegocio" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-[#EC546D] focus:outline-none transition-all shadow-sm">
                    <option value="3.0" selected>Línea B2C (Aretes, Figuras, Shadowboxes, Decoración)</option>
                    <option value="clicker_logo">🎛️ Clicker Fidget - Logo / Imagen Bicolor (Grande)</option>
                    <option value="clicker_letra">🏷️ Clicker / Llaverito Mono-Letra / Inicial</option>
                </select>
            </div>

            <!-- Grilla de Entradas: Cantidad, Tiempo y Peso -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Cantidad de Piezas (Q)</label>
                    <input type="number" id="cantidad" value="1" min="1" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Tiempo Impresión (Ej: 1.4, 1:20 o 59m)</label>
                        <input type="text" id="tiempoHoras" value="59m" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Peso Total (Gramos)</label>
                        <input type="number" id="pesoTotal" value="14" min="1" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                    </div>
                </div>
            </div>

            <!-- BADGE DINÁMICO DE MAYOREO -->
            <div id="badgeMayoreo" class="hidden w-full bg-emerald-100 border border-emerald-300 text-emerald-800 text-[11px] font-extrabold py-2 px-3 rounded-xl text-center shadow-sm">
                🎉 ¡Precio de Mayoreo Aplicado! (+12 piezas)
            </div>

            <!-- CAJA DE RESUMEN EJECUTIVO PARA MOSTRADOR -->
            <div class="bg-white rounded-2xl p-4 border border-rose-200/80 shadow-sm text-center space-y-3 mt-4">
                <div class="flex justify-between text-xs font-semibold text-slate-500 px-1">
                    <span>📦 Peso Total: <strong id="lblPesoTotal" class="text-slate-800">14g</strong></span>
                    <span>⏱️ Tiempo Estimado: <strong id="lblTiempoTotal" class="text-slate-800">59m</strong></span>
                </div>

                <div class="grid grid-cols-2 gap-2 border-t border-rose-100 pt-3">
                    <div>
                        <span class="block text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">Precio Total</span>
                        <span class="text-2xl font-black text-[#EC546D]" id="lblPrecioTotal">$99.00 <span class="text-xs font-bold">MXN</span></span>
                    </div>
                    <div class="border-l border-rose-100">
                        <span class="block text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">Precio Unitario</span>
                        <span class="text-2xl font-black text-[#355345]" id="lblPrecioUnitario">$99.00 <span class="text-xs font-bold">MXN</span></span>
                    </div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN PARA MOSTRADOR Y CLIENTE -->
            <button type="button" id="btnWhatsapp" class="w-full bg-[#EC546D] hover:bg-[#D9435B] text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-rose-300/60 transition-all flex items-center justify-center gap-2 text-sm active:scale-95 mt-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                </svg>
                <span>Enviar Cotización a WhatsApp</span>
            </button>
            
            <div class="text-center pt-1">
                <button type="button" id="btnPDF" class="text-xs text-slate-400 hover:text-slate-600 underline font-semibold transition-all">
                    📄 Imprimir / Guardar en PDF
                </button>
            </div>
        </form>
    </main>

    <!-- SCRIPT DE COTIZACIÓN CON MAYOREO AUTOMÁTICO Y FORMATEO DE MONEDA -->
    <script>
        const CONFIG = {
            costoGramo: 0.50,
            costoHora: 9.00,
            herrajeClicker: 2.63,
            numWhatsapp: "5215559650025"
        };

        // Formateador oficial de moneda MXN con comas para millares
        const fmtMXN = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const fmtInt = new Intl.NumberFormat('es-MX');

        function parseTiempo(val) {
            let str = (val || '').toString().trim().toLowerCase();
            if(!str) return 0;
            if(str.includes(':')) {
                let p = str.split(':');
                return (parseFloat(p[0]) || 0) + ((parseFloat(p[1]) || 0) / 60);
            }
            if(str.includes('h') || str.includes('m')) {
                let hMatch = str.match(/(\d+)\s*h/);
                let mMatch = str.match(/(\d+)\s*m/);
                let h = hMatch ? parseFloat(hMatch[1]) : 0;
                let m = mMatch ? parseFloat(mMatch[1]) : 0;
                return h + (m / 60);
            }
            return parseFloat(str) || 0;
        }

        function formatTiempoVisual(horasDec) {
            let totalMin = Math.round(horasDec * 60);
            if(totalMin < 60) return `${totalMin}m`;
            let h = Math.floor(totalMin / 60);
            let m = totalMin % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        function calcular() {
            const Q = Math.max(1, parseInt(document.getElementById('cantidad').value) || 1);
            const horasUnitarias = parseTiempo(document.getElementById('tiempoHoras').value);
            const gramosUnitarios = Math.max(0, parseFloat(document.getElementById('pesoTotal').value) || 0);
            const tipo = document.getElementById('lineaNegocio').value;
            const badgeMayoreo = document.getElementById('badgeMayoreo');

            const esMayoreo = Q >= 12;

            // Mostrar/ocultar aviso visual de mayoreo
            if(esMayoreo) {
                badgeMayoreo.classList.remove('hidden');
            } else {
                badgeMayoreo.classList.add('hidden');
            }

            let costoMat = gramosUnitarios * CONFIG.costoGramo;
            let costoEne = horasUnitarias * CONFIG.costoHora;
            let pUnitario = 0;

            if(tipo === 'clicker_logo') {
                let cDirecto = costoMat + costoEne + CONFIG.herrajeClicker;
                let mult = esMayoreo ? 2.6 : 3.2;
                let piso = esMayoreo ? 75 : 99;
                pUnitario = Math.max(piso, Math.ceil(cDirecto * mult));
            } else if(tipo === 'clicker_letra') {
                let cDirecto = costoMat + costoEne + CONFIG.herrajeClicker;
                let mult = esMayoreo ? 2.4 : 3.0;
                let piso = esMayoreo ? 35 : 45;
                pUnitario = Math.max(piso, Math.ceil(cDirecto * mult));
            } else {
                let multBase = parseFloat(tipo) || 3.0;
                let mult = esMayoreo ? 2.5 : multBase;
                let cDirecto = costoMat + costoEne;
                pUnitario = Math.ceil(cDirecto * mult);
            }

            const pTotal = pUnitario * Q;
            const pesoAcumulado = gramosUnitarios * Q;
            const tiempoAcumuladoFormatted = formatTiempoVisual(horasUnitarias * Q);

            // Actualización del DOM con separador de millares
            document.getElementById('lblPesoTotal').innerText = `${fmtInt.format(pesoAcumulado)}g`;
            document.getElementById('lblTiempoTotal').innerText = tiempoAcumuladoFormatted;
            document.getElementById('lblPrecioUnitario').innerHTML = `${fmtMXN.format(pUnitario)} <span class="text-xs font-bold">MXN</span>`;
            document.getElementById('lblPrecioTotal').innerHTML = `${fmtMXN.format(pTotal)} <span class="text-xs font-bold">MXN</span>`;
        }

        const formEl = document.getElementById('cotizadorForm');
        ['input', 'change', 'keyup'].forEach(evt => {
            formEl.addEventListener(evt, calcular);
        });

        document.getElementById('btnWhatsapp').addEventListener('click', () => {
            const Q = document.getElementById('cantidad').value;
            const sel = document.getElementById('lineaNegocio');
            const nomProyecto = sel.options[sel.selectedIndex].text.trim();
            const pTotal = document.getElementById('lblPrecioTotal').innerText;
            const pUnit = document.getElementById('lblPrecioUnitario').innerText;
            const esMayoreo = parseInt(Q) >= 12 ? "\n🎉 *Beneficio:* Precio de Mayoreo Aplicado (+12 pcs)" : "";

            const msg = encodeURIComponent(
                `*COTIZACIÓN OFICIAL - SHAMMAH 3D*\n\n` +
                `📌 *Producto:* ${nomProyecto}\n` +
                `📦 *Cantidad:* ${fmtInt.format(Q)} pieza(s)\n` +
                `💵 *Precio Unitario:* ${pUnit}\n` +
                `💰 *TOTAL ESTIMADO:* ${pTotal}${esMayoreo}\n\n` +
                `Hola, confirmo la cotización para proceder con la orden.`
            );
            window.open(`https://wa.me/${CONFIG.numWhatsapp}?text=${msg}`, '_blank');
        });

        document.getElementById('btnPDF').addEventListener('click', () => {
            window.print();
        });

        calcular();
    </script>
</body>
</html>
