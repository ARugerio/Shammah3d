<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Instantáneo | SHAMMAH 3D</title>
    <!-- Tailwind CSS CDN para estilizado rápido y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-rose-50/40 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-rose-100 overflow-hidden">
        
        <!-- ENCABEZADO DE MARCA ACTUALIZADO -->
        <header class="bg-white pt-8 pb-3 text-center px-6">
            <h1 class="text-3xl font-extrabold text-emerald-900 tracking-wider">SHAMMAH 3D</h1>
            <p class="text-xs font-medium text-rose-400 mt-1 uppercase tracking-widest">Diseña ♥ Crea ♥ Imprime</p>
        </header>

        <!-- FORMULARIO DE COTIZACIÓN -->
        <form id="cotizadorForm" class="px-6 pb-8 space-y-5">
            
            <div class="border-t border-rose-100 pt-4">
                <h2 class="text-sm font-semibold text-slate-700 flex items-center gap-2 mb-3">
                    <span class="text-rose-500">⚙️</span> Parámetros de Cotización
                </h2>
                
                <!-- Línea de Negocio -->
                <label class="block text-xs font-semibold text-slate-600 mb-1">Línea de Producto / Proyecto</label>
                <select id="lineaNegocio" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-700 focus:ring-2 focus:ring-rose-400 focus:outline-none transition-all">
                    <option value="2.8">Línea B2C (Llaveros, Minis, Figures, Shadowboxes) — 2.8x</option>
                    <option value="3.2">Línea Utilitaria / Prototipos Mecánicos — 3.2x</option>
                    <option value="2.2">Lotes de Mayoreo (> 20 pcs) — 2.2x</option>
                </select>
            </div>

            <!-- Grilla de Entradas: Cantidad, Tiempo y Peso -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Cantidad de Piezas (Q)</label>
                    <input type="number" id="cantidad" value="1" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tiempo Impresión (Horas)</label>
                        <input type="number" id="tiempoHoras" value="2.0" step="0.1" min="0.1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Peso Total (Gramos)</label>
                        <input type="number" id="pesoTotal" value="55" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Insumos Adicionales (Checkboxes Limpios) -->
            <div class="bg-rose-50/50 p-3.5 rounded-2xl border border-rose-100 space-y-2.5">
                <span class="block text-xs font-semibold text-slate-700">Insumos Adicionales (por unidad):</span>
                
                <label class="flex items-center gap-2.5 text-xs text-slate-600 cursor-pointer select-none">
                    <input type="checkbox" id="addNFC" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-400 border-slate-300">
                    <span>Chip NFC NTAG215/216 Integrado</span>
                </label>
                
                <label class="flex items-center gap-2.5 text-xs text-slate-600 cursor-pointer select-none">
                    <input type="checkbox" id="addHerraje" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-400 border-slate-300">
                    <span>Argolla / Herraje para Llavero</span>
                </label>

                <label class="flex items-center gap-2.5 text-xs text-slate-600 cursor-pointer select-none">
                    <input type="checkbox" id="addEmpaque" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-400 border-slate-300">
                    <span>Empaque & Presentación B2C</span>
                </label>
            </div>

            <!-- RESUMEN EJECUTIVO (PÚBLICO / LIMPIO) -->
            <div class="bg-gradient-to-br from-rose-50 to-white p-4 rounded-2xl border border-rose-200/80 text-center space-y-3">
                <div class="flex justify-between text-xs text-slate-500 px-2 font-medium">
                    <span>📦 Unidades: <strong id="lblCantidad" class="text-slate-800">1 pc</strong></span>
                    <span>⏱️ Tiempo Total: <strong id="lblTiempo" class="text-slate-800">2.0 hrs</strong></span>
                </div>

                <div class="grid grid-cols-2 gap-2 border-t border-rose-100 pt-3">
                    <div>
                        <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider">Precio Total</span>
                        <span class="text-xl font-extrabold text-rose-500" id="lblPrecioTotal">$127.40 <xs class="text-xs font-normal">MXN</xs></span>
                    </div>
                    <div class="border-l border-rose-100">
                        <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider">Precio Unitario</span>
                        <span class="text-xl font-extrabold text-emerald-900" id="lblPrecioUnitario">$127.40 <xs class="text-xs font-normal">MXN</xs></span>
                    </div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <button type="button" id="btnWhatsapp" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-200 transition-all flex items-center justify-center gap-2 text-sm">
                <span>💬</span> Solicitar Pedido por WhatsApp
            </button>
            
            <div class="text-center">
                <button type="button" id="btnPDF" class="text-xs text-slate-400 hover:text-slate-600 underline font-medium transition-all">
                    📄 Descargar Cotización PDF
                </button>
            </div>
        </form>
    </main>

    <!-- LÓGICA JAVASCRIP ES6+ -->
    <script>
        // Parámetros de costos confidenciales (no visibles en la interfaz)
        const METRICAS_INTERNAS = {
            costoGramoFilamento: 0.50,   // Base: $450 MXN / kg
            costoHoraImpresora: 9.0,    // Energía + desgaste
            costoNFC: 30.00,
        };

        const form = document.getElementById('cotizadorForm');

        function recalcularCotizacion() {
            // Lectura de variables directas del DOM
            const Q = parseInt(document.getElementById('cantidad').value) || 1;
            const horasImpresion = parseFloat(document.getElementById('tiempoHoras').value) || 0;
            const gramosTotales = parseFloat(document.getElementById('pesoTotal').value) || 0;
            const multiplicadorLinea = parseFloat(document.getElementById('lineaNegocio').value) || 3;

            // Selección de adicionales
            const incNFC = document.getElementById('addNFC').checked ? METRICAS_INTERNAS.costoNFC : 0;
            const incHerraje = document.getElementById('addHerraje').checked ? METRICAS_INTERNAS.costoHerraje : 0;
            const incEmpaque = document.getElementById('addEmpaque').checked ? METRICAS_INTERNAS.costoEmpaque : 0;

            // Cálculo del Costo Directo Interno (Permanece privado en JS)
            const costoMaterial = gramosTotales * METRICAS_INTERNAS.costoGramoFilamento;
            const costoTiempo = horasImpresion * METRICAS_INTERNAS.costoHoraImpresora;
            const costoInsumos = incNFC + incHerraje + incEmpaque;

            const costoDirectoUnitario = costoMaterial + costoTiempo + costoInsumos;

            // Precio de Venta Público
            const precioUnitario = Math.ceil(costoDirectoUnitario * multiplicadorLinea);
            const precioTotal = precioUnitario * Q;

            // Actualización de etiquetas visibles para el cliente
            document.getElementById('lblCantidad').innerText = `${Q} pc${Q > 1 ? 's' : ''}`;
            document.getElementById('lblTiempo').innerText = `${horasImpresion.toFixed(1)} hrs`;
            document.getElementById('lblPrecioTotal').innerHTML = `$${precioTotal.toFixed(2)} <span class="text-xs font-normal">MXN</span>`;
            document.getElementById('lblPrecioUnitario').innerHTML = `$${precioUnitario.toFixed(2)} <span class="text-xs font-normal">MXN</span>`;
        }

        // Listeners de eventos
        form.addEventListener('input', recalcularCotizacion);
        document.getElementById('lineaNegocio').addEventListener('change', recalcularCotizacion);

        // Render inicial
        recalcularCotizacion();
    </script>
</body>
</html>
