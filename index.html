<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Instantáneo | SHAMMAH 3D</title>
    <!-- Tailwind CSS CDN para renderizado rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Lexend', sans-serif; 
            background-color: #FFF7F8;
        }
        @media print {
            body { background: white; }
            #btnWhatsapp, #btnPDF { display: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- BADGE SUPERIOR DE MARCA -->
    <div class="mb-3 px-5 py-1.5 bg-[#FDE2E7] border border-rose-200/80 rounded-full text-[11px] font-extrabold text-[#EC546D] tracking-wider uppercase shadow-sm text-center">
        COTIZACIÓN INSTANTÁNEA DE IMPRESIÓN 3D
    </div>

    <!-- ENCABEZADO PRINCIPAL DE LOGOTIPO -->
    <header class="text-center mb-5">
        <h1 class="text-4xl sm:text-5xl font-black text-[#355345] tracking-wide">SHAMMAH <span class="text-3xl sm:text-4xl">3D</span></h1>
        <p class="text-xs font-bold text-[#EC546D] mt-1 uppercase tracking-widest">Diseña ♥ Crea ♥ Imprime</p>
    </header>

    <!-- TARJETA CONTENEDORA PRINCIPAL -->
    <main class="w-full max-w-md bg-[#FDE8ED]/90 backdrop-blur-sm rounded-[2.5rem] shadow-xl shadow-rose-200/50 border border-rose-200/80 p-6 sm:p-8 space-y-5">
        
        <!-- FORMULARIO DE COTIZACIÓN -->
        <form id="cotizadorForm" class="space-y-4" onsubmit="return false;">
            
            <!-- TÍTULO DE SECCIÓN -->
            <div class="flex items-center gap-2 border-b border-rose-200/60 pb-2">
                <span class="text-amber-400 text-lg">⚡</span>
                <h2 class="text-base font-extrabold text-[#355345]">Cotizador Rápido</h2>
            </div>
            
            <!-- Selector de Línea de Negocio (Márgenes ocultos al cliente) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Enfoque Comercial / Proyecto</label>
                <select id="lineaNegocio" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-[#EC546D] focus:outline-none transition-all shadow-sm">
                    <option value="3.0" selected>Línea B2C (Llaveros, Aretes, Figuras, Shadowboxes)</option>
                    <option value="3.5">Línea Utilitaria / Prototipos Mecánicos</option>
                    <option value="2.5">Lotes de Mayoreo (> 20 pcs)</option>
                </select>
            </div>

            <!-- Grilla de Entradas: Cantidad, Tiempo y Peso -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Cantidad de Piezas (Q)</label>
                    <input type="number" id="cantidad" value="1" min="1" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Tiempo Impresión (Horas)</label>
                        <input type="number" id="tiempoHoras" value="2.0" step="0.1" min="0.1" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">Peso Total (Gramos)</label>
                        <input type="number" id="pesoTotal" value="55" min="1" class="w-full bg-white/90 border border-rose-200/80 rounded-2xl px-3.5 py-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#EC546D] focus:outline-none shadow-sm">
                    </div>
                </div>
            </div>

            <!-- Insumo Adicional Tecnológico NFC -->
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Insumo Extra / Ensamble</label>
                <div class="bg-white/90 p-3 rounded-2xl border border-rose-200/80 shadow-sm">
                    <label class="flex items-center gap-2.5 text-xs font-semibold text-slate-700 cursor-pointer select-none">
                        <input type="checkbox" id="addNFC" class="w-4 h-4 rounded text-[#EC546D] focus:ring-[#EC546D] border-slate-300">
                        <span>Chip NFC NTAG215/216 Integrado (Configuración y programación)</span>
                    </label>
                </div>
            </div>

            <!-- CAJA DE RESUMEN EJECUTIVO (ESTILO TARJETA BLANCA DE MARCA) -->
            <div class="bg-white rounded-2xl p-4 border border-rose-200/80 shadow-sm text-center space-y-3 mt-4">
                <div class="flex justify-between text-xs font-semibold text-slate-500 px-1">
                    <span>📦 Peso Total: <strong id="lblPesoTotal" class="text-slate-800">55g</strong></span>
                    <span>⏱️ Tiempo Estimado: <strong id="lblTiempoTotal" class="text-slate-800">2.0 hrs</strong></span>
                </div>

                <div class="grid grid-cols-2 gap-2 border-t border-rose-100 pt-3">
                    <div>
                        <span class="block text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">Precio Total</span>
                        <span class="text-2xl font-black text-[#EC546D]" id="lblPrecioTotal">$137.00 <span class="text-xs font-bold">MXN</span></span>
                    </div>
                    <div class="border-l border-rose-100">
                        <span class="block text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">Precio Unitario</span>
                        <span class="text-2xl font-black text-[#355345]" id="lblPrecioUnitario">$137.00 <span class="text-xs font-bold">MXN</span></span>
                    </div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <button type="button" id="btnWhatsapp" class="w-full bg-[#EC546D] hover:bg-[#D9435B] text-white font-extrabold py-3.5 rounded-2xl shadow-lg shadow-rose-300/60 transition-all flex items-center justify-center gap-2 text-sm active:scale-95 mt-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                </svg>
                <span>Solicitar Pedido por WhatsApp</span>
            </button>
            
            <div class="text-center pt-1">
                <button type="button" id="btnPDF" class="text-xs text-slate-400 hover:text-slate-600 underline font-semibold transition-all">
                    📄 Descargar Cotización PDF
                </button>
            </div>
        </form>
    </main>

    <!-- LÓGICA JAVASCRIPT ES6+ -->
    <script>
        // Parámetros confidenciales de costo interno
        const METRICAS_INTERNAS = {
            costoGramoFilamento: 0.50,   // Base: $500 MXN / kg
            costoHoraImpresora: 9.00,    // Energía + desgaste
            costoNFC: 30.00              // Costo interno chip + servicio NFC
        };

        const NUMERO_WHATSAPP = "5215559650025"; // Canal oficial WhatsApp

        const form = document.getElementById('cotizadorForm');

        function recalcularCotizacion() {
            // Lectura de entradas
            const Q = parseInt(document.getElementById('cantidad').value) || 1;
            const horasImpresion = parseFloat(document.getElementById('tiempoHoras').value) || 0;
            const gramosTotales = parseFloat(document.getElementById('pesoTotal').value) || 0;
            const multiplicadorLinea = parseFloat(document.getElementById('lineaNegocio').value) || 3.0;

            // Selección de adicionales
            const incNFC = document.getElementById('addNFC').checked ? METRICAS_INTERNAS.costoNFC : 0;

            // Cálculo del Costo Directo Interno
            const costoMaterial = gramosTotales * METRICAS_INTERNAS.costoGramoFilamento;
            const costoTiempo = horasImpresion * METRICAS_INTERNAS.costoHoraImpresora;
            const costoInsumos = incNFC;

            const costoDirectoUnitario = costoMaterial + costoTiempo + costoInsumos;

            // Precio de Venta Público
            const precioUnitario = Math.ceil(costoDirectoUnitario * multiplicadorLinea);
            const precioTotal = precioUnitario * Q;

            // Muestra acumulada de peso y tiempo del proyecto
            const pesoLote = gramosTotales * Q;
            const tiempoLote = (horasImpresion * Q).toFixed(1);

            // Actualización de la interfaz
            document.getElementById('lblPesoTotal').innerText = `${pesoLote}g`;
            document.getElementById('lblTiempoTotal').innerText = `${tiempoLote} hrs`;
            document.getElementById('lblPrecioTotal').innerHTML = `$${precioTotal.toFixed(2)} <span class="text-xs font-bold">MXN</span>`;
            document.getElementById('lblPrecioUnitario').innerHTML = `$${precioUnitario.toFixed(2)} <span class="text-xs font-bold">MXN</span>`;
        }

        // Evento de disparo WhatsApp
        document.getElementById('btnWhatsapp').addEventListener('click', () => {
            const Q = document.getElementById('cantidad').value;
            const lineaSelect = document.getElementById('lineaNegocio');
            const nombreLinea = lineaSelect.options[lineaSelect.selectedIndex].text.trim();
            const incluirNFC = document.getElementById('addNFC').checked ? "\n📲 *Adicional:* Chip NFC Programado" : "";
            const precioTotal = document.getElementById('lblPrecioTotal').innerText;
            const precioUnitario = document.getElementById('lblPrecioUnitario').innerText;

            const mensaje = encodeURIComponent(
                `*NUEVA COTIZACIÓN - SHAMMAH 3D*\n\n` +
                `📌 *Proyecto:* ${nombreLinea}\n` +
                `📦 *Cantidad:* ${Q} pieza(s)\n` +
                `💵 *Precio Unitario:* ${precioUnitario}\n` +
                `💰 *TOTAL ESTIMADO:* ${precioTotal}${incluirNFC}\n\n` +
                `Hola, me interesa proceder con la orden.`
            );

            window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`, '_blank');
        });

        // Evento de impresión/PDF
        document.getElementById('btnPDF').addEventListener('click', () => {
            window.print();
        });

        // Listeners de eventos DOM
        form.addEventListener('input', recalcularCotizacion);
        document.getElementById('lineaNegocio').addEventListener('change', recalcularCotizacion);

        // Ejecución inicial
        recalcularCotizacion();
    </script>
</body>
</html>
